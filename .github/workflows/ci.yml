name: CI

on: [push, pull_request]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: pytest -v

  build-exe:
    needs: unit-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: pip install pyinstaller
      - run: pytest -v
      - run: pyinstaller codeguard.spec
      - name: Smoke test
        run: ./dist/codeguard.exe --help
      - name: Generate and verify SHA-256
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/codeguard.exe"
          $sha = Join-Path $PWD "dist/codeguard.exe.sha256"

          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Missing release executable: $exe"
          }

          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
              $sha,
              "$hash`n",
              [System.Text.UTF8Encoding]::new($false)
          )

          if (-not (Test-Path -LiteralPath $sha -PathType Leaf)) {
              throw "SHA-256 file was not created: $sha"
          }

          $recorded = (Get-Content -LiteralPath $sha -Raw).Trim()
          if ($recorded -notmatch '^[0-9a-f]{64}$') {
              throw "Invalid SHA-256 file format: $recorded"
          }

          if ($recorded -ne $hash) {
              throw "SHA-256 verification mismatch"
          }

          Get-ChildItem -LiteralPath (Join-Path $PWD "dist") |
              Select-Object Name, Length
      - name: Verify release assets
        shell: pwsh
        run: |
          $required = @(
              "./dist/codeguard.exe",
              "./dist/codeguard.exe.sha256"
          )

          foreach ($path in $required) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Missing required release asset: $path"
              }
              if ((Get-Item -LiteralPath $path).Length -le 0) {
                  throw "Empty release asset: $path"
              }
          }

          $actual = (Get-FileHash -LiteralPath "./dist/codeguard.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $recorded = (Get-Content -LiteralPath "./dist/codeguard.exe.sha256" -Raw).Trim().ToLowerInvariant()

          if ($actual -ne $recorded) {
              throw "Release asset SHA-256 mismatch"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: codeguard-exe
          if-no-files-found: error
          path: |
            ./dist/codeguard.exe
            ./dist/codeguard.exe.sha256
